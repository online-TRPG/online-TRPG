version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      realtime:
        patterns:
          - "socket.io*"
          - "engine.io*"
          - "ws"
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: "/ai"
    schedule:
      interval: weekly
      day: monday
      time: "03:37"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "03:57"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/be"
    schedule:
      interval: weekly
      day: monday
      time: "04:07"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: "/ai"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: "/infra/nginx"
    schedule:
      interval: weekly
      day: monday
      time: "04:27"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
